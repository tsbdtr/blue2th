# Groups the auto-generated release notes (`gh release create --generate-notes`)
# by label. The labels come from the pull request titles: pr-title.yml applies
# the one scripts/pr-type-label.sh derives from the Conventional Commits type.
changelog:
  exclude:
    labels: [ci]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Refactoring
      labels: [refactor]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
