name: CI

# The local hooks in .githooks/ are opt-in (git config core.hooksPath .githooks),
# so they guarantee nothing on a shared repository. This workflow replays the same
# three gates unconditionally.

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # A bare runner does not compile this workspace. Two families of native
      # libraries are needed, and the failure lands at link time with a message
      # that says very little:
      #
      #   - the server links D-Bus (bluer) and ALSA (rodio -> cpal);
      #   - the mobile crate pulls dioxus-desktop -> wry on a host build, which
      #     drags in the whole GTK/WebKit stack even though the app targets
      #     Android. libxdo comes from muda (menus), libssl from tungstenite.
      #
      # The pkg-config names were read from the build script output, not guessed:
      # webkit2gtk-4.1, javascriptcoregtk-4.1, libsoup-3.0.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The three commands from CLAUDE.md, verbatim. --workspace is explicit rather
      # than load-bearing: the root is a virtual manifest since the mobile crate moved
      # into blue2th-frontend/, so a bare `cargo test` already runs every member. It
      # was load-bearing when the root was a package. Keeping it means the command
      # survives a package reappearing at the root.
      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            -W clippy::todo \
            -W clippy::unreachable \
            -W clippy::unimplemented

      # assets/tailwind.css is generated and untracked, but build.rs creates an
      # empty one when missing, so a fresh clone can run the tests as is.
      # One test is #[ignore]d: it needs a live PipeWire daemon.
      - name: test
        run: cargo test --workspace

  scripts:
    name: "Release scripts: shell tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The signing tests run the real keytool, zipalign and apksigner: a JDK
      # for keytool, then build-tools at the version the scripts resolve them
      # under. The runner refuses to start when any of the three is missing,
      # so a runner without them fails this job instead of skipping the one
      # script that handles the release key.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install build-tools
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Run the shell tests
        run: BUILD_TOOLS_VERSION=36.0.0 scripts/tests/run.sh

  # Security advisories, the licence allowlist, duplicate crates and crate
  # sources, per deny.toml. The licence check is what makes the librespot rule
  # in CLAUDE.md mechanical: a GPL crate arriving through an update fails here.
  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  licence-headers:
    name: Every .rs carries the SPDX header
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The current split existed because the header was applied by hand: a whole
      # crate had none, plus one stray file that did. Without a gate it drifts back.
      - name: Check the header is the first line of every tracked .rs
        run: |
          expected='// SPDX-License-Identifier: MIT OR Apache-2.0'
          missing=$(git ls-files '*.rs' | while read -r f; do
            head -1 "$f" | grep -qxF "$expected" || echo "  $f"
          done)
          if [ -n "$missing" ]; then
            echo "Missing or misplaced SPDX header — it must be the first line:"
            echo "$missing"
            echo
            echo "Expected exactly: $expected"
            exit 1
          fi
