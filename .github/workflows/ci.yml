name: CI

# The local hooks in .githooks/ are opt-in (git config core.hooksPath .githooks),
# so they guarantee nothing on a shared repository. This workflow replays the same
# three gates unconditionally.

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the checkout. Without this block the token this
# repository hands each job is write-capable by default, and a compromised
# action or a stray `gh` call in a step could push, comment or release with it.
# scripts/check-workflow-permissions.sh holds every workflow to a block like
# this one, from the `scripts` job below.
permissions:
  contents: read

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # A bare runner does not compile this workspace: the server links native
      # libraries, and the failure lands at link time with a message that says
      # very little. Each package is here for the server alone:
      #
      #   - libdbus-1-dev: bluer talks to BlueZ over D-Bus;
      #   - libpipewire-0.3-dev: pipewire-rs links libpipewire-0.3;
      #   - clang, libclang-dev: pipewire-rs generates its bindings with bindgen,
      #     which loads libclang and needs clang's resource headers (#110);
      #   - pkg-config: how the -sys crates' build scripts find the two libraries.
      #
      # The frontend adds nothing: its renderer is an Android-only dependency, so
      # a host build compiles no dioxus-desktop, wry or GTK/WebKit stack (#175).
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            clang

      # Pinned, not `@stable`: a new stable release brings new clippy lints, and
      # `-D warnings` turns them into failures a local run on an older toolchain
      # never sees (#66's pull request failed on `chunks_exact_to_as_chunks`,
      # new in 1.98). Bump it on purpose, with `rustup update` on the dev PC.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: aarch64-linux-android, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The three gates from CLAUDE.md, verbatim. --workspace is explicit rather
      # than load-bearing: the root is a virtual manifest since the mobile crate moved
      # into blue2th-frontend/, so a bare `cargo test` already runs every member. It
      # was load-bearing when the root was a package. Keeping it means the command
      # survives a package reappearing at the root.
      - name: fmt
        run: cargo fmt --check

      # Host, Android and wasm (#167): code that only one target uses is gated
      # with `cfg` rather than left as a dead-code allowance, and native-only
      # code must be gated, not left as a wasm warning. The Android run needs
      # no NDK: clippy does not link.
      - name: clippy
        run: scripts/clippy.sh

      # assets/tailwind.css is generated and untracked, but build.rs creates an
      # empty one when missing, so a fresh clone can run the tests as is.
      # One test is #[ignore]d: it needs a live PipeWire daemon.
      - name: test
        run: cargo test --workspace

  # The browser build (#159). `cargo test` never compiles for wasm; the wasm
  # lint runs in the quality job, and this job proves the bundle still builds.
  web:
    name: "Frontend: browser build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Same pin as the quality job: the bundle must build with the toolchain
      # the lint ran on.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Same dx as release.yml: the web build must use the CLI the app ships with.
      - uses: cargo-bins/cargo-binstall@v1.25.1

      - name: Install dioxus-cli 0.7.10
        run: cargo binstall -y dioxus-cli@0.7.10

      # No feature flags: the crate has no default feature to drop, and dx
      # enables `web` itself for --platform web (observed with dx 0.7.10). The
      # Android-only dioxus entry, which carries `mobile`, is inactive on wasm.
      - name: dx build (web)
        run: dx build --platform web --package blue2th-frontend

  scripts:
    name: "Release scripts: shell tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The signing tests run the real keytool, zipalign and apksigner: a JDK
      # for keytool, then build-tools at the version the scripts resolve them
      # under. The runner refuses to start when any of the three is missing,
      # so a runner without them fails this job instead of skipping the one
      # script that handles the release key.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # `packages` is set because the action's default, `tools platform-tools`,
      # names the legacy `tools` package Google removed from the SDK repository
      # (2026-09); with it, sdkmanager exits 1 before any step of ours runs.
      # `packages` is set because the action's default, `tools platform-tools`,
      # names the legacy `tools` package Google removed from the SDK repository
      # (2026-09); with it, sdkmanager exits 1 before any step of ours runs.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install build-tools
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Run the shell tests
        run: BUILD_TOOLS_VERSION=36.0.0 scripts/tests/run.sh

      - name: Every workflow limits its GITHUB_TOKEN
        run: scripts/check-workflow-permissions.sh

  # Security advisories, the licence allowlist, duplicate crates and crate
  # sources, per deny.toml. The licence check is what makes the librespot rule
  # in CLAUDE.md mechanical: a GPL crate arriving through an update fails here.
  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  licence-headers:
    name: Every .rs carries the SPDX header
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The current split existed because the header was applied by hand: a whole
      # crate had none, plus one stray file that did. Without a gate it drifts back.
      - name: Check the header is the first line of every tracked .rs
        run: |
          expected='// SPDX-License-Identifier: MIT OR Apache-2.0'
          missing=$(git ls-files '*.rs' | while read -r f; do
            head -1 "$f" | grep -qxF "$expected" || echo "  $f"
          done)
          if [ -n "$missing" ]; then
            echo "Missing or misplaced SPDX header — it must be the first line:"
            echo "$missing"
            echo
            echo "Expected exactly: $expected"
            exit 1
          fi
