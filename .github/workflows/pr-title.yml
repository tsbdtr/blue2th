name: PR title

# Split out of ci.yml, and not merged back in, because of the trigger.
#
# A pull_request workflow with no `types:` gets GitHub's default,
# [opened, synchronize, reopened] — `edited` is absent, so retitling a pull
# request re-runs nothing and the result from opening stands forever. Re-running
# the failed job does not help either: Actions replays the original event
# payload, so the check reads the old title again. The only ways out were pushing
# a commit or closing and reopening the pull request (see #39).
#
# ci.yml cannot simply add `edited`: it carries `cancel-in-progress`, so every
# edit to a title *or a description* would cancel the running build and restart a
# job matrix that installs the GTK/WebKit and D-Bus/ALSA stacks. This check is a
# checkout and a grep, so it gets its own trigger and its own concurrency group.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-convention:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    # `pull-requests: write` is for the labelling step below; the validation
    # itself needs nothing beyond reading the checkout.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # The pattern is read from .githooks/commit-msg rather than copied, so the
      # hook and CI cannot drift apart — which is exactly how the test gate ended
      # up skipping half the suite (see the history of .githooks/pre-commit).
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN=$(sed -n "s/^PATTERN='\(.*\)'$/\1/p" .githooks/commit-msg)
          if [ -z "$PATTERN" ]; then
            echo "Could not read PATTERN from .githooks/commit-msg"
            exit 1
          fi
          if ! printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "PR title does not follow Conventional Commits."
            echo "Expected: <type>(<scope>): <description>"
            echo "Got: $TITLE"
            exit 1
          fi

      # Derive the pull request's label from its type, so the release notes
      # (.github/release.yml) can group what was merged. Best-effort: a fork's
      # token cannot write labels, and a label deleted on the repository must not
      # turn the title check red. The table lives in scripts/pr-type-label.sh.
      - name: Label from the type
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Exit 3 is "valid title, no label to add": the other mapped labels
          # still come off, so a pull request retitled from feat: to test: does
          # not keep `enhancement`. Exit 1 or 2 fails this step so its own log
          # says why; continue-on-error keeps the check green either way, since
          # the previous step has already judged the title.
          status=0
          label=$(scripts/pr-type-label.sh "$TITLE") || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit 1
          fi
          remove=$(scripts/pr-type-label.sh --all | grep -vx "$label" | paste -sd,)
          # An empty label never reaches --add-label: `gh` refuses it rather
          # than ignoring it. Removing a label the pull request does not carry
          # is fine with `gh`.
          if [ -n "$label" ]; then
            gh pr edit "$NUMBER" --add-label "$label" --remove-label "$remove"
          else
            gh pr edit "$NUMBER" --remove-label "$remove"
          fi
