[package]
name = "xtask"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

# Repository tooling, reached through `cargo check-conventions` (#180). Not a
# fourth layer: it ships nothing and depends on no project crate.

[dependencies]
# `full` parses every item kind, `visit` walks nested modules.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
# `span-locations` is what gives a span its line number outside a proc macro.
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "0.8"
