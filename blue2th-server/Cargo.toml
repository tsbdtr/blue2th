[package]
name = "blue2th-server"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

# PC-side backend for the blue2th audio engine (Axum/Tokio). It will drive BlueZ
# (via `bluer`) and PipeWire in later phases; phase 0 only exposes /health.
# See docs/ROADMAP.md.

[dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
blue2th-proto = { path = "../blue2th-proto" }
# BlueZ over D-Bus (requires libdbus dev headers at build time and bluetoothd at
# runtime). The `bluetoothd` feature enables the high-level Adapter/Device API.
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
async-stream = "0.3"
# Audio: WAV decoding (via `symphonia`) plus the `playback` backend (cpal → ALSA →
# PipeWire) used to stream the embedded tone to the connected speaker's sink.
# Disposable phase 3-4 test source, kept behind `audio.rs` so librespot can
# replace it in phase 5. `cpal` needs the ALSA dev headers at build time
# (`alsa-lib-devel`). The real output lives on a dedicated thread because cpal
# streams are `!Send`; tests use a no-op output so they run without an audio
# device. Volume targets the PipeWire sink (via `wpctl`), not rodio's gain.
rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }
# Spotify OAuth (PKCE) + Web API transport (phase 5.2). `reqwest` uses rustls (no
# OpenSSL, matching the mobile crate's TLS choice); `sha2`/`base64` derive the PKCE
# challenge; `rand` mints the verifier and CSRF state; `url` builds the authorize
# URL; `serde`/`serde_json` (de)serialize the DTOs and Web API payloads.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Phase 6.4: the pairing QR, rendered as text a terminal can show. Default
# features off on purpose — the `image`/`svg` renderers would drag a whole image
# stack in for a backend that only ever prints characters.
qrcode = { version = "0.14", default-features = false }
url = "2"
# Phase 6.6: publishing `_blue2th._tcp.local.` so the app finds the backend
# without the operator retyping its address. See the workspace entry.
mdns-sd = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
