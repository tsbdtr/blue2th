[package]
name = "blue2th-server"
version = "0.1.0"
edition = "2021"

# PC-side backend for the blue2th audio engine (Axum/Tokio). It will drive BlueZ
# (via `bluer`) and PipeWire in later phases; phase 0 only exposes /health.
# See docs/ROADMAP.md.

[dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
blue2th-proto = { path = "../blue2th-proto" }
# BlueZ over D-Bus (requires libdbus dev headers at build time and bluetoothd at
# runtime). The `bluetoothd` feature enables the high-level Adapter/Device API.
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
async-stream = "0.3"
# Audio decoding (uses `symphonia`). Disposable phase 3-4 test source, kept
# behind `audio.rs` so librespot can replace it in phase 5. Default features are
# disabled to avoid the `cpal`/ALSA build dependency: phase 3 output is routed
# through PipeWire, and only WAV decoding is needed here. The GREEN-phase
# implementer enables whatever playback feature the chosen output path requires.
rodio = { version = "0.22", default-features = false, features = ["wav"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
