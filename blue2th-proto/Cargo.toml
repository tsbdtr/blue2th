[package]
name = "blue2th-proto"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

# Shared data-transfer types for the mobile app <-> PC backend contract.
# Must stay target-agnostic: it compiles both for the Android app and the Linux
# backend, so no platform-specific dependencies here.

[dependencies]
serde = { workspace = true }

[features]
# #197: the SPAKE2 exchange the native app and the backend pair through
# (`pake`). Off by default, so the browser build, which pairs over
# `POST /api/pair`, never compiles it.
pake = []

[dev-dependencies]
serde_json = "1"
# #197: the raw SPAKE2 the `pake` tests run against our halves, to pin the
# group, the roles and the identities the exchange uses.
spake2 = "0.4.0"
