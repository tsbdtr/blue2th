[package]
name = "blue2th-proto"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

# Shared data-transfer types for the mobile app <-> PC backend contract.
# Must stay target-agnostic: it compiles both for the Android app and the Linux
# backend, so no platform-specific dependencies here.

[dependencies]
serde = { workspace = true }
# #197: the `pake` feature's SPAKE2 (`Ed25519Group`) and the HMAC-SHA256 of its
# confirmations. Pure Rust, no platform code: they compile for the app and the
# backend alike. `hmac`/`sha2` on the versions `spake2` itself pulls in.
spake2 = { version = "0.4.0", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# #197: the SPAKE2 exchange the native app and the backend pair through
# (`pake`). Off by default, so the browser build, which pairs over
# `POST /api/pair`, never compiles it.
pake = ["dep:spake2", "dep:hmac", "dep:sha2"]

[dev-dependencies]
serde_json = "1"
# #197: the raw SPAKE2 the `pake` tests run against our halves, to pin the
# group, the roles and the identities the exchange uses.
spake2 = "0.4.0"
