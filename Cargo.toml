[package]
name = "blue2th"
version = "0.1.0"
authors = ["tsbdtr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["mobile", "router"] }
rust-i18n = "3"
tokio = { version = "1", features = ["time"] }
blue2th-proto = { path = "blue2th-proto" }
# No TLS backend: the backend is reached over plain HTTP on the LAN (a TLS option
# can be added later). `json` pulls in serde_json for response decoding.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
ndk-context = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]

# ── Workspace ────────────────────────────────────────────────────────────────
# The root `blue2th` package (the Dioxus mobile app) is the workspace root and an
# implicit member. Backend crates for the PC audio engine live alongside it; see
# docs/ROADMAP.md. resolver = "2" preserves the single-crate feature unification
# (notably the app's target-specific `cfg(target_os = "android")` deps).
[workspace]
members = ["blue2th-proto", "blue2th-server"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1" }
