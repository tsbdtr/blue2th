# ── Workspace ────────────────────────────────────────────────────────────────
# Three layers, one workspace; the design record is docs/ARCHITECTURE.md.
#
#   blue2th-frontend — the Dioxus 0.7 Android remote
#   blue2th-server   — the Axum/Tokio backend driving BlueZ and audio
#   blue2th-proto    — the serde DTOs shared by both
#
# resolver = "2" is explicit because a virtual manifest defaults to "1", which
# would change feature unification — notably the app's target-specific
# `cfg(target_os = "android")` dependencies.
[workspace]
members = ["blue2th-frontend", "blue2th-proto", "blue2th-server"]
resolver = "2"

# Version, licence and publishability are properties of the *product*, not of
# each crate: the app, the backend and the shared DTOs are built from one tag and
# released together. Hoisted so the three cannot drift.
#
# One consequence to accept: a server-only fix still moves the app's version.
# The number designates the release, not the crate that changed — which is why
# the changelog has to say which layer moved.
#
# `publish = false` because none of the three belongs on crates.io: two are
# applications, and the third is a private contract between them. A publication
# cannot be retracted, so the guard is worth its three lines. Should `blue2th-proto`
# ever need publishing, override both keys on that crate alone.
[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1" }
# Phase 6.6: mDNS service discovery, shared by the backend (which publishes
# `_blue2th._tcp.local.`) and the app (which browses for it). Pure Rust and
# runtime-agnostic, so the same crate serves the Tokio backend and the Android
# app — no Avahi on the PC, no `NsdManager` on the phone.
mdns-sd = "0.21"
