# ── Workspace ────────────────────────────────────────────────────────────────
# Three layers, one workspace; the full vision is in docs/ROADMAP.md.
#
#   blue2th-frontend — the Dioxus 0.7 Android remote
#   blue2th-server   — the Axum/Tokio backend driving BlueZ and audio
#   blue2th-proto    — the serde DTOs shared by both
#
# resolver = "2" is explicit because a virtual manifest defaults to "1", which
# would change feature unification — notably the app's target-specific
# `cfg(target_os = "android")` dependencies.
[workspace]
members = ["blue2th-frontend", "blue2th-proto", "blue2th-server"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1" }
# Phase 6.6: mDNS service discovery, shared by the backend (which publishes
# `_blue2th._tcp.local.`) and the app (which browses for it). Pure Rust and
# runtime-agnostic, so the same crate serves the Tokio backend and the Android
# app — no Avahi on the PC, no `NsdManager` on the phone.
mdns-sd = "0.21"
