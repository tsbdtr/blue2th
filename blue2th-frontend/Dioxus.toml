# ── Android application identity ─────────────────────────────────────────────
# The application identifier is what Android uses to tell one app from another.
# Left implicit, dx derives it from the cargo package name — which made renaming
# the crate a silent, irreversible break: a different identifier is a different
# app, so existing installs can no longer be updated and their SharedPreferences
# (the paired backends and their tokens) are lost.
#
# Pinned here so the identifier never follows a refactor again. It must not
# change once anyone has installed the app. `[android]` is a top-level section:
# `[bundle] identifier` is only the cross-platform fallback.
[android]
identifier = "io.github.tsbdtr.blue2th"

[application]

# Stock Dioxus/wry activity plus an onNewIntent override, so the Spotify OAuth
# redirect reaches src/deep_link.rs when the app is already running.
android_main_activity = "android/MainActivity.kt"

# dx's generated manifest plus launchMode="singleTop" on the main activity, so
# the redirect is delivered to the running activity instead of stacking a second
# one. See the comment at the top of the file.
android_manifest = "android/AndroidManifest.xml"

# NOTE: dx REPLACES the manifest with `android_manifest` above rather than
# merging into it, so the two sections below are currently inert — the permissions
# and the blue2th:// intent-filter are declared directly in
# android/AndroidManifest.xml. They are kept in sync so that dropping the custom
# manifest restores the same result.

# Custom URL scheme: Spotify's consent screen redirects to
# blue2th://spotify-callback?code=…&state=…, which Android routes to the app
# through the intent-filter generated from this scheme (phase 5.2).
[deep_links]
schemes = ["blue2th"]

[android.raw]
manifest = """
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.INTERNET" />
"""

[web.app]

# HTML title tag content
title = "blue2th"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []

# ── Dev proxy for `dx serve --platform web` (#160) ───────────────────────────
# In the browser every API call goes to the page's own origin; dx relays each
# top-level prefix of the server's `ROUTES` table to a backend on its default
# port. One entry per prefix, never one for `/`: a proxy URL needs a non-empty
# path (dx 0.7.10), and a catch-all would swallow the page's own assets.
# blue2th-server/tests/web_proxy.rs checks this list against `ROUTES`.

[[web.proxy]]
backend = "http://127.0.0.1:4000/adapters"

[[web.proxy]]
backend = "http://127.0.0.1:4000/client"

[[web.proxy]]
backend = "http://127.0.0.1:4000/config"

[[web.proxy]]
backend = "http://127.0.0.1:4000/devices"

[[web.proxy]]
backend = "http://127.0.0.1:4000/health"

[[web.proxy]]
backend = "http://127.0.0.1:4000/pair"

[[web.proxy]]
backend = "http://127.0.0.1:4000/pause"

[[web.proxy]]
backend = "http://127.0.0.1:4000/play"

[[web.proxy]]
backend = "http://127.0.0.1:4000/playback"

[[web.proxy]]
backend = "http://127.0.0.1:4000/scan"

[[web.proxy]]
backend = "http://127.0.0.1:4000/spotify"

[[web.proxy]]
backend = "http://127.0.0.1:4000/stop"

[[web.proxy]]
backend = "http://127.0.0.1:4000/targets"

[[web.proxy]]
backend = "http://127.0.0.1:4000/volume"
