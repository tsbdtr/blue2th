[package]
name = "blue2th-frontend"
version.workspace = true
authors = ["tsbdtr"]
edition = "2021"
license.workspace = true
publish.workspace = true

[dependencies]
# No renderer here: Android gets `mobile` from its target table below, and the
# browser build enables the crate's `web` feature. A renderer on this line would
# reach every host build, where `mobile` resolves to dioxus-desktop and wry and
# needs the GTK/WebKit system libraries (#175).
dioxus = { workspace = true, features = ["router"] }
rust-i18n = "4"
blue2th-proto = { path = "../blue2th-proto" }
# No TLS feature on this shared line: the browser build compiles it, and the
# browser does the TLS behind `fetch`. The native targets add rustls below (#196).
# `json` pulls in serde_json for response decoding; `stream` enables
# `bytes_stream()` for consuming the /scan SSE feed.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
# The persisted app settings (phase 6.2) are serde types owned by the app, not
# shared DTOs, so the derive lives here rather than in `blue2th-proto`.
serde = { workspace = true }
serde_json = "1"
futures = "0.3"

# tokio's timer and runtime, and the mDNS browse, do not build for the browser
# (#159). Gated on `not(wasm32)` rather than on Android so the host build, and
# host clippy, keep checking the native code.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "rt"] }
# Phase 6.6: browsing `_blue2th._tcp.local.` on the LAN. See the workspace entry.
mdns-sd = { workspace = true }
# #196: the backend is trusted by the SHA-256 of its public key, pinned per
# backend, through a custom rustls verifier handed to reqwest with
# `use_preconfigured_tls`. No root store and no provider of reqwest's own: the
# pin replaces the web PKI, and `ring` is the one provider — never `aws_lc_rs`,
# which rustls' defaults bring. `rustls-webpki` reads the certificate's SPKI;
# `ring` hashes it. All already in the lock through the server.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
ring = "0.17"
# The connector layer that lifts the refused-key error back into reach of the
# source chain (`tls::lift_tls_error`). Already in the tree through reqwest.
tower = { version = "0.5", default-features = false, features = ["util"] }

# The browser's timer behind `timer::sleep`. Already in the wasm tree through
# dioxus-web; only its `futures` feature is new.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
# The browser glue (#160): settings in `localStorage`, the backend at
# `location.origin`, presence from the page lifecycle events, posted with a
# `keepalive` fetch (reqwest's wasm client has none). Already in the wasm tree
# through dioxus-web; its `wasm_bindgen` and `js_sys` re-exports spare two
# direct dependencies.
web-sys = { version = "0.3", features = [
    "Document",
    "EventTarget",
    "Headers",
    "Location",
    "RequestInit",
    "Storage",
    "VisibilityState",
    "Window",
] }

# The renderer is a property of the target, not a default feature: under
# `cfg(target_os = "android")` exactly, so no host build — `cargo test`, host
# clippy — compiles it (#175).
[target.'cfg(target_os = "android")'.dependencies]
dioxus = { workspace = true, features = ["mobile"] }
jni = { version = "0.21", default-features = false }
ndk-context = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Parses this crate's own manifest in tests/web_build.rs (#159). Already in the
# lockfile through rust-i18n-support, so the lockfile gains no crate.
toml = "0.8"

# #196: the loopback TLS backend the pinning tests talk to — a certificate made
# per test (`rcgen`), served by `rustls` through `tokio-rustls`, all on `ring`,
# never `aws_lc_rs`; `sha2` computes the expected pin on the test's side, apart
# from the code under test. All four already in the lock through the server.
# Native only, like the `tls` module they test.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"

[features]
web = ["dioxus/web"]
