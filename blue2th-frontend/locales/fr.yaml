# La page de réglages de l'application (phase 6.2). Le nom vient d'un bug : un
# bloc `settings:` portait les réglages par appareil, et une seconde clé
# `settings:` faisait disparaître l'un des deux en silence. La page par appareil
# a été supprimée avec la pile Bluetooth embarquée, mais le préfixe reste — le
# renommer casserait toutes les traductions pour un gain nul.
