# The app-wide settings page (phase 6.2). The name comes from a bug: a `settings:`
# block held the per-device settings, and a second `settings:` key silently
# dropped one of the two. That per-device page went with the on-phone Bluetooth
# stack, but the prefix stays — renaming it would break every translation for
# nothing.
app_settings:
  title: "Settings"
  backends: "Backends"
  no_backend_yet: "No backend configured yet"
  active: "Active"
  activate: "Use"
  delete: "Delete"
  add: "Add"
  test: "Test"
  test_ok: "Backend answered"
  name_placeholder: "Name (e.g. Salon)"
  url_placeholder: "http://192.168.1.10:4000"
  section_playback: "Playback"
  restore_during_playback: "Rejoin while playing"
  restore_during_playback_hint: "A device that comes back is used again straight away. Playback cuts for a moment when the routing changes."
  auto_reconnect: "Reconnect on its own"
  auto_reconnect_hint: "The backend calls a remembered device back until it answers, so it is ready without you touching anything."
  section_pairing: "Pairing"
  pairing_method: "How to pair"
  pairing_method_code: "Type a code"
  pairing_method_qr: "Scan the QR"
  pairing_qr_hint: "Scan the QR printed by the server with any camera app: it opens blue2th and pairs this backend."
  pair: "Pair"
  pairing_code_placeholder: "Code shown by the server"
  paired_ok: "Paired"
  not_paired: "Not paired — pair this backend first"
  section_discovery: "Discovery"
  search_network: "Search the network"
  searching: "Searching…"
  no_backend_found: "No backend found on this network"
  discovery_unsupported: "This device cannot search the network. Add the address by hand."
  auto_repair_url: "Repair addresses automatically"
  auto_repair_url_hint: "A known backend found at a new address is updated straight away. Turn this off to be asked first."
  discovery_adds_backends: "Add backends found"
  discovery_adds_backends_hint: "A backend the app does not know can be added from the search results. It still has to be paired."
  discovered_known: "Already known"
  discovered_up_to_date: "Up to date"
  discovered_new: "New"
  confirm_repair: "%{name} moved to %{url}. Update it?"
  address_repaired: "Address updated"
